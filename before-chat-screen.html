<!DOCTYPE html><html class="h-full bg-black" lang="vi" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>ChatGPT</title>
<!-- Load Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0d0d0d',
            chatBubble: '#1b3b64',
            inputBg: '#212121',
            iconMuted: '#999999',
            textSecondary: '#8e8e8e',
            accentBlue: '#2563eb'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-overrides">
    body {
      background-color: #000000;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Hide native scrollbars while preserving scroll functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="h-full flex overflow-hidden font-sans select-none text-[15px]">
<!-- BEGIN: Left Navigation Rail -->
<aside class="w-[52px] h-full flex flex-col justify-between items-center py-3.5 z-20 flex-shrink-0 bg-black" data-purpose="sidebar-rail">
<!-- Top icon group -->
<div class="flex flex-col items-center gap-5 w-full">
<!-- OpenAI Logo -->
<button aria-label="ChatGPT Home" class="p-1.5 text-white/90 hover:text-white rounded-lg transition-colors" type="button"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="3"></rect><line x1="9" x2="9" y1="3" y2="21"></line></svg></button>
<!-- New Chat Button -->
<button aria-label="Đoạn chat mới" class="p-1.5 text-[#b4b4b4] hover:text-white transition-colors" type="button">
<svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
</svg>
</button>
<!-- Search Button -->
<button aria-label="Tìm kiếm" class="p-1.5 text-[#b4b4b4] hover:text-white transition-colors" type="button">
<svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="11" cy="11" r="8"></circle>
<line x1="21" x2="16.65" y1="21" y2="16.65"></line>
</svg>
</button>
<!-- Chat History Bubble -->
<button aria-label="Lịch sử chat" class="p-1.5 text-[#b4b4b4] hover:text-white transition-colors" type="button">
<svg class="w-[21px] h-[21px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2z"></path>
</svg>
</button>
</div>
<!-- Bottom user avatar -->
<div class="mb-1">
<button aria-label="Hồ sơ người dùng" class="w-8 h-8 rounded-full bg-[#df6612] text-white flex items-center justify-center font-semibold text-xs tracking-tight shadow-inner" type="button"><span class="text-[12px] font-bold text-white tracking-normal">GB</span></button>
</div>
</aside>
<!-- END: Left Navigation Rail -->
<!-- BEGIN: MainContentArea -->
<div class="flex-1 flex flex-col h-full bg-black relative" data-purpose="main-layout">
<!-- BEGIN: TopBar -->
<header class="h-14 flex items-center justify-end px-5 gap-3.5 flex-shrink-0 z-10" data-purpose="top-header-actions">
<!-- Upgrade Button -->
<button class="flex items-center gap-1.5 text-[#55b9ff] hover:text-[#7dcdff] text-[13.5px] font-normal transition-colors py-1.5 px-2.5 rounded-lg hover:bg-white/5" type="button">


</button>
<!-- Share Button -->

<!-- Options Menu Button -->
<button aria-label="Mở thanh bên" class="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/5 transition-colors" type="button"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg></button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: CenterInteractiveContainer -->
<main class="flex-1 flex flex-col items-center justify-center px-4 -mt-16">
<div class="w-full max-w-[760px] flex flex-col items-center">
<!-- Greeting Heading -->
<h1 class="text-white text-[28px] font-medium tracking-tight mb-8">
          Hôm nay bạn muốn làm gì?
        </h1>
<!-- Search / Chat Input Box Container -->
<div class="w-full bg-[#212121] rounded-full h-[52px] px-3.5 flex items-center justify-between border border-transparent focus-within:border-[#383838] transition-colors" data-purpose="chat-input-bar">
<!-- Left Elements: Plus icon & text input placeholder -->
<div class="flex items-center flex-1 gap-2.5 h-full px-2">
<input class="w-full bg-transparent border-0 text-[15px] text-white placeholder-[#858585] focus:outline-none focus:ring-0 p-0 font-normal leading-normal text-left cursor-text" placeholder="Cứ hỏi nhé" type="text">
</div>
<!-- Right Action Controls inside Input -->
<div class="flex items-center gap-2 pr-0.5">
<!-- Voice mode waveform button / Send button -->
<button aria-label="Gửi tin nhắn" class="w-[34px] h-[34px] bg-[#1d63d6] hover:bg-[#256deb] text-white rounded-full flex items-center justify-center transition-all ml-0.5 shadow-sm" type="button"><svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</div>
<!-- BEGIN: QuickSuggestions -->
<!-- Quick action suggestions directly underneath the search bar -->

<!-- END: QuickSuggestions -->
</div>
</main>
<!-- END: CenterInteractiveContainer -->
</div>
<!-- END: MainContentArea -->
</body></html>
